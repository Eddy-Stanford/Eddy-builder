name: Test GNU/GNU+DEV Build 

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-gnu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the GNU Docker image
      run: docker build . --file gnu.Dockerfile -t robcking/eddy-builder-gnu

    - name: Build the GNU+DEV Docker image
      run: docker build . --file gnu_dev.Dockerfile -t robcking/eddy-builder-gnu-dev
